name: Refresh card data

# Scryfall publishes new bulk data (and prices) every 12 to 24 hours. This rebuilds the site with the latest and deploys it.
# Needs two repository secrets, added by the owner in GitHub (Settings, Secrets and variables, Actions):
#   CLOUDFLARE_API_TOKEN   a token that can edit Workers
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
# Without them the deploy step fails and the site simply keeps its last data.
#
# More than one game (docs/MULTI-GAME.md, section 6): public/data is restored from the cache before the build, so a game whose
# build fails keeps its last good data, and it is saved again after a good run. Only a Magic failure stops the deploy. Every
# failure is reported in one GitHub issue labelled `data`.

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore the last good card data
        uses: actions/cache@v4
        with:
          path: public/data
          key: card-data-${{ github.run_id }}
          restore-keys: card-data-
      - run: npm run build
        env:
          CARD_DATA: '1'
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          command: deploy
      - name: Report card data failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f .cache/data-failures.json ] || exit 0
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The card data refresh had a failure: $run_url"$'\n\n'"$(jq -r '.[] | "- \(.game): \(.message)"' .cache/data-failures.json)"
          existing=$(gh issue list --label data --state open --search "Card data refresh failed in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Card data refresh failed" --label data --body "$body"
          fi

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>End trip confirmation: desktop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&amp;family=Karla:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d7e3e4}a:hover{color:#ffffff}
@keyframes bd-rise{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(-920px);opacity:0}}
@keyframes bd-cue{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes bd-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bd-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bd-far{animation:bd-rise 22s linear infinite;opacity:.35}
.bd-mid{animation:bd-rise 14s linear infinite;opacity:.55}
.bd-near{animation:bd-rise 9s linear infinite;opacity:.75}
.bd-kelp{transform-origin:bottom center;animation:bd-sway 8s ease-in-out infinite}
.bd-cue{animation:bd-cue 2.6s ease-in-out infinite}
.bd-drift{animation:bd-drift 9s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.bd-far,.bd-mid,.bd-near,.bd-kelp,.bd-cue,.bd-drift{animation:none}}
</style>

<style>body{margin:0;background:#0b0f12}body>div:first-of-type{margin:0 auto}</style>
</head>
<body>


<div style="position: relative; box-sizing: border-box; width: 1440px; height: 800px; overflow: hidden; font-family: 'Karla', ui-sans-serif, system-ui, sans-serif; color: #f1f3f2; background: #12212a"><header style="background: #172a35; border-bottom: 1px solid rgba(230, 236, 236, 0.16)"><div style="max-width: 1320px; margin: 0 auto; padding: 14px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px"><a href="#home" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #f1f3f2"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 64 64"><circle cx="32" cy="28" r="22" fill="#c8a96a"></circle><circle cx="32" cy="29" r="12" fill="#172a35" stroke="#8e7442" stroke-width="3"></circle><path d="M20 29h24M32 17v24" stroke="#8e7442" stroke-width="2"></path><path d="M12 50h40l-4 10H16z" fill="#a98d55"></path></svg><span style="font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 20px">Binder Diver</span></a><span style="color: #c3cccc">/</span><span style="font-weight: 700">Store dive</span><div style="margin-left: auto; display: flex; gap: 10px"><button type="button" style="font: inherit; font-weight: 700; font-size: 16px; border-radius: 12px; padding: 12px 20px; min-height: 48px; cursor: pointer; color: #f1f3f2; background: transparent; border: 1px solid rgba(230, 236, 236, 0.4)">Back to plan</button><button type="button" style="font: inherit; font-weight: 700; font-size: 16px; border-radius: 12px; padding: 12px 20px; min-height: 48px; cursor: pointer; color: #f1f3f2; background: transparent; border: 1px solid rgba(230, 236, 236, 0.4)">End trip</button></div></div></header><div style="max-width: 1320px; margin: 0 auto; padding: 24px 28px; display: flex; gap: 32px; align-items: flex-start"><aside style="flex: 0 0 300px; display: flex; flex-direction: column; gap: 18px"><div style="position: relative"><span style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #c3cccc">Binder</span><button type="button" aria-haspopup="listbox" aria-expanded="true" style="margin-top: 6px; width: 100%; text-align: left; font: inherit; font-weight: 700; font-size: 17px; color: #f1f3f2; background: #172a35; border: 1px solid #6fb6e0; border-radius: 12px; padding: 0 12px; min-height: 52px; display: flex; align-items: center; justify-content: space-between; cursor: pointer">2. Commander Box <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></button></div></aside>
<main style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #6fb6e0">Binder 2 of 4</p><h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 40px">Commander Box</h1>
<div style="background: #172a35; border: 1px solid rgba(230, 236, 236, 0.16); border-radius: 16px; height: 420px; display: flex; align-items: center; justify-content: center; color: #c3cccc">Card grid</div></main></div><div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55)"></div><section role="alertdialog" aria-modal="true" aria-labelledby="et-t" aria-describedby="et-d" style="position: absolute; left: 50%; top: 200px; margin-left: -230px; width: 460px; box-sizing: border-box; border-radius: 18px; background: #12212a; border: 1px solid rgba(230, 236, 236, 0.28); padding: 22px; display: flex; flex-direction: column; gap: 12px"><h2 id="et-t" style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 26px">End this trip?</h2><p id="et-d" style="margin: 0; font-size: 16px; line-height: 1.5; color: #c3cccc">You've searched 1 of 4 binders. 9 cards are still needed. Your lists are saved either way.</p><div style="display: flex; flex-direction: row; gap: 10px; justify-content: flex-end; margin-top: 4px"><button type="button" style="font: inherit; font-weight: 700; font-size: 15px; color: #f1f3f2; background: transparent; border: 1px solid rgba(230, 236, 236, 0.4); border-radius: 10px; padding: 0 14px; min-height: 44px; cursor: pointer; min-height: 48px">Keep diving</button><button type="button" style="font: inherit; font-weight: 700; font-size: 16px; color: #14191c; background: #6fb6e0; border: 0; border-radius: 12px; padding: 0 20px; min-height: 48px; cursor: pointer">End trip</button></div></section></div>

</body>
</html>

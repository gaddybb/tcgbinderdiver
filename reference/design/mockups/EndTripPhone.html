<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>End trip confirmation: phone</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&amp;family=Karla:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d7e3e4}a:hover{color:#ffffff}
@keyframes bd-rise{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(-920px);opacity:0}}
@keyframes bd-cue{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes bd-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bd-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bd-far{animation:bd-rise 22s linear infinite;opacity:.35}
.bd-mid{animation:bd-rise 14s linear infinite;opacity:.55}
.bd-near{animation:bd-rise 9s linear infinite;opacity:.75}
.bd-kelp{transform-origin:bottom center;animation:bd-sway 8s ease-in-out infinite}
.bd-cue{animation:bd-cue 2.6s ease-in-out infinite}
.bd-drift{animation:bd-drift 9s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.bd-far,.bd-mid,.bd-near,.bd-kelp,.bd-cue,.bd-drift{animation:none}}
</style>

<style>body{margin:0;background:#0b0f12}body>div:first-of-type{margin:0 auto}</style>
</head>
<body>


<div style="position: relative; box-sizing: border-box; width: 390px; height: 844px; overflow: hidden; font-family: 'Karla', ui-sans-serif, system-ui, sans-serif; color: #f1f3f2; background: #12212a"><header style="position: absolute; left: 0; right: 0; top: 0; z-index: 2; background: #172a35; border-bottom: 1px solid rgba(230, 236, 236, 0.16); padding: 10px 14px; display: flex; align-items: center; gap: 10px"><button type="button" aria-label="Back to plan" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(230, 236, 236, 0.16); background: transparent; color: #f1f3f2; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg></button><div style="flex: 1 1 auto; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 20px">Store dive</div><button type="button" style="font: inherit; font-weight: 700; font-size: 15px; color: #f1f3f2; background: transparent; border: 1px solid rgba(230, 236, 236, 0.4); border-radius: 12px; padding: 0 14px; min-height: 44px; cursor: pointer">End trip</button></header><div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55)"></div><section role="alertdialog" aria-modal="true" aria-labelledby="et-t" aria-describedby="et-d" style="position: absolute; left: 50%; top: 230px; margin-left: -170px; width: 340px; box-sizing: border-box; border-radius: 18px; background: #12212a; border: 1px solid rgba(230, 236, 236, 0.28); padding: 22px; display: flex; flex-direction: column; gap: 12px"><h2 id="et-t" style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 26px">End this trip?</h2><p id="et-d" style="margin: 0; font-size: 16px; line-height: 1.5; color: #c3cccc">You've searched 1 of 4 binders. 9 cards are still needed. Your lists are saved either way.</p><div style="display: flex; flex-direction: column-reverse; gap: 10px; justify-content: flex-end; margin-top: 4px"><button type="button" style="font: inherit; font-weight: 700; font-size: 15px; color: #f1f3f2; background: transparent; border: 1px solid rgba(230, 236, 236, 0.4); border-radius: 10px; padding: 0 14px; min-height: 44px; cursor: pointer; min-height: 48px">Keep diving</button><button type="button" style="font: inherit; font-weight: 700; font-size: 16px; color: #14191c; background: #6fb6e0; border: 0; border-radius: 12px; padding: 0 20px; min-height: 48px; cursor: pointer">End trip</button></div></section></div>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copies across lists, card detail: phone</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&amp;family=Karla:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d7e3e4}a:hover{color:#ffffff}
@keyframes bd-rise{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(-920px);opacity:0}}
@keyframes bd-cue{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes bd-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bd-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bd-far{animation:bd-rise 22s linear infinite;opacity:.35}
.bd-mid{animation:bd-rise 14s linear infinite;opacity:.55}
.bd-near{animation:bd-rise 9s linear infinite;opacity:.75}
.bd-kelp{transform-origin:bottom center;animation:bd-sway 8s ease-in-out infinite}
.bd-cue{animation:bd-cue 2.6s ease-in-out infinite}
.bd-drift{animation:bd-drift 9s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.bd-far,.bd-mid,.bd-near,.bd-kelp,.bd-cue,.bd-drift{animation:none}}
</style>

<style>body{margin:0;background:#0b0f12}body>div:first-of-type{margin:0 auto}</style>
</head>
<body>


<div style="position: relative; box-sizing: border-box; width: 390px; height: 1000px; overflow: hidden; font-family: 'Karla', ui-sans-serif, system-ui, sans-serif; color: #f1f3f2; background: #12212a"><section role="dialog" aria-modal="true" aria-labelledby="q-t" style="position: absolute; inset: 0; background: #12212a; overflow: hidden">
<header style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(230, 236, 236, 0.16)"><button type="button" style="font: inherit; font-weight: 700; font-size: 15px; color: #f1f3f2; background: transparent; border: 1px solid rgba(230, 236, 236, 0.4); border-radius: 10px; padding: 0 14px; min-height: 44px; cursor: pointer; width: 44px; padding: 0">✕</button><span style="flex: 1 1 auto; font-size: 15px; color: #c3cccc; text-align: center">Foundations · card 1 of 6</span></header>
<div style="padding: 16px 16px 110px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: center"><div aria-hidden="true" style="width: 180px; height: 251px; flex: 0 0 auto; box-sizing: border-box; border-radius: 8px; background: #253e4c; border: 1px solid rgba(230, 236, 236, 0.16); border-top: 6px solid #6fa37a; display: flex; align-items: center; justify-content: center;"><span style="font-size: 11px; color: #9aa5a5">Card image</span></div></div>
<div><h2 id="q-t" style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 26px">Llanowar Elves</h2><p style="margin: 4px 0 0; font-size: 15px; color: #c3cccc">FDN 227 · common · $0.30</p></div>
<div style="display: flex; align-items: center; gap: 10px"><div role="progressbar" aria-label="Copies found" aria-valuemin="0" aria-valuemax="4" aria-valuenow="1" style="flex: 1 1 auto; height: 8px; border-radius: 999px; background: #253e4c; overflow: hidden"><div style="width: 25%; height: 100%; background: #6fb6e0"></div></div><strong style="font-size: 15px">1 of 4 found</strong></div>
<section aria-labelledby="sp-h" style="background: #172a35; border: 1px solid rgba(230, 236, 236, 0.16); border-radius: 16px; padding: 6px 14px 10px"><h3 id="sp-h" style="margin: 10px 0 2px; font-size: 17px">Needed on 2 lists</h3>
<p style="margin: 0 0 6px; font-size: 13px; color: #c3cccc">Found +1 fills lists top to bottom. Pick a list here to put a copy somewhere else.</p>
<ul style="list-style: none; margin: 0; padding: 0"><li style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(230, 236, 236, 0.16)"><div style="flex: 1 1 auto"><div style="font-weight: 700; font-size: 15px">Elves</div><div style="font-size: 13px; color: #c3cccc">1 of 3 found</div></div><button type="button" style="font: inherit; font-weight: 700; font-size: 14px; color: #f1f3f2; background: transparent; border: 1px solid rgba(230, 236, 236, 0.4); border-radius: 10px; padding: 0 12px; min-height: 40px; cursor: pointer">Found for this list</button></li><li style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(230, 236, 236, 0.16)"><div style="flex: 1 1 auto"><div style="font-weight: 700; font-size: 15px">Wishlist</div><div style="font-size: 13px; color: #c3cccc">0 of 1 found</div></div><button type="button" style="font: inherit; font-weight: 700; font-size: 14px; color: #f1f3f2; background: transparent; border: 1px solid rgba(230, 236, 236, 0.4); border-radius: 10px; padding: 0 12px; min-height: 40px; cursor: pointer">Found for this list</button></li></ul></section>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #172a35; border-top: 1px solid rgba(230, 236, 236, 0.16); padding: 12px 16px 20px; display: flex; gap: 10px"><button type="button" aria-label="Undo one" style="width: 44px; height: 44px; flex: 0 0 auto; border-radius: 10px; border: 1px solid rgba(230, 236, 236, 0.4); background: transparent; color: #f1f3f2; font-size: 20px; cursor: pointer">−</button><button type="button" style="flex: 1 1 auto; font: inherit; font-weight: 700; font-size: 17px; color: #14191c; background: #6fb6e0; border: 0; border-radius: 12px; min-height: 52px; cursor: pointer">Found +1</button></div></section></div>

</body>
</html>

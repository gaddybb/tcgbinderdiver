<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&amp;family=Karla:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d7e3e4}a:hover{color:#ffffff}
@keyframes bd-rise{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(-920px);opacity:0}}
@keyframes bd-cue{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes bd-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bd-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bd-far{animation:bd-rise 22s linear infinite;opacity:.35}
.bd-mid{animation:bd-rise 14s linear infinite;opacity:.55}
.bd-near{animation:bd-rise 9s linear infinite;opacity:.75}
.bd-kelp{transform-origin:bottom center;animation:bd-sway 8s ease-in-out infinite}
.bd-cue{animation:bd-cue 2.6s ease-in-out infinite}
.bd-drift{animation:bd-drift 9s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.bd-far,.bd-mid,.bd-near,.bd-kelp,.bd-cue,.bd-drift{animation:none}}
</style>

<style>body{margin:0;background:#0b0f12}body>div:first-of-type{margin:0 auto}</style>
</head>
<body>


<div style="position: relative; box-sizing: border-box; width: 390px; height: 1100px; overflow: hidden; font-family: 'Karla', ui-sans-serif, system-ui, sans-serif; color: #f1f3f2; background: #12212a"><header style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #172a35; border-bottom: 1px solid rgba(230, 236, 236, 0.16)">
<div style="flex: 1 1 auto; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 19px">New list</div><span style="font-size: 14px; color: #c3cccc">Step 1 of 4</span></header>
<main style="padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 16px"><ol aria-label="Import steps" style="list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 8px"><li aria-current="step" style="display: flex; align-items: center; gap: 8px; flex: 1 1 auto"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; box-sizing: border-box; background: #6fb6e0; color: #14191c; border: 0">1</span><span style="font-size: 14px; font-weight: 700; color: #f1f3f2; white-space: nowrap">Name it</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Step 1 of 4</span><span aria-hidden="true" style="flex: 1 1 auto; min-width: 12px; height: 2px; background: rgba(230, 236, 236, 0.2)"></span></li><li style="display: flex; align-items: center; gap: 8px; flex: 0 0 auto"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; box-sizing: border-box; background: transparent; color: #c3cccc; border: 1.5px solid rgba(230, 236, 236, 0.35)">2</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Step 2 of 4</span><span aria-hidden="true" style="flex: 1 1 auto; min-width: 12px; height: 2px; background: rgba(230, 236, 236, 0.2)"></span></li><li style="display: flex; align-items: center; gap: 8px; flex: 0 0 auto"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; box-sizing: border-box; background: transparent; color: #c3cccc; border: 1.5px solid rgba(230, 236, 236, 0.35)">3</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Step 3 of 4</span><span aria-hidden="true" style="flex: 1 1 auto; min-width: 12px; height: 2px; background: rgba(230, 236, 236, 0.2)"></span></li><li style="display: flex; align-items: center; gap: 8px; flex: 0 0 auto"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; box-sizing: border-box; background: transparent; color: #c3cccc; border: 1.5px solid rgba(230, 236, 236, 0.35)">4</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Step 4 of 4</span></li></ol>
<div><h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 27px; line-height: 1.12">Where should these cards go?</h1><p style="margin: 6px 0 0; font-size: 15px; color: #c3cccc">Start a new deck, or add them to your wishlist.</p></div><div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #c3cccc"><span>Add these cards to</span><div role="radiogroup" aria-label="List type" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; border: 1px solid rgba(230, 236, 236, 0.16); background: #1f3542"><button type="button" role="radio" aria-checked="true" style="flex: 1 1 0; font: inherit; font-weight: 700; font-size: 15px; min-height: 44px; border-radius: 8px; border: 0; cursor: pointer; color: #14191c; background: #6fb6e0">New deck</button><button type="button" role="radio" aria-checked="false" style="flex: 1 1 0; font: inherit; font-weight: 700; font-size: 15px; min-height: 44px; border-radius: 8px; border: 0; cursor: pointer; color: #f1f3f2; background: transparent">Wishlist</button></div></div><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #c3cccc">Deck name<input value="" placeholder="Name your deck" style="font: inherit; font-size: 16px; color: #f1f3f2; background: #1f3542; border: 1px solid rgba(230, 236, 236, 0.16); border-radius: 10px; padding: 11px 12px; min-height: 46px; width: 100%; box-sizing: border-box"></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #c3cccc">Your decklist<textarea rows="5" aria-invalid="true" aria-describedby="m-e" style="font: inherit; font-size: 16px; color: #f1f3f2; background: #1f3542; border: 1px solid rgba(230, 236, 236, 0.16); border-radius: 10px; padding: 11px 12px; min-height: 46px; width: 100%; box-sizing: border-box; border: 2px solid #e2a08f"></textarea></label><p id="m-e" role="alert" style="margin: 0; font-size: 15px; color: #e2a08f">The box is empty. Paste a list from Moxfield, Archidekt or EDHREC.</p></main>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #172a35; border-top: 1px solid rgba(230, 236, 236, 0.16); padding: 12px 16px 20px; display: flex"><button type="button" disabled aria-disabled="true" style="font: inherit; font-weight: 700; font-size: 16px; color: #8a9494; background: #253e4c; border: 0; border-radius: 12px; padding: 0 22px; width: 100%; min-height: 48px; cursor: not-allowed">Look up cards</button></div></div>
